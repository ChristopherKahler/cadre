# Release — runs on a version tag, and on a manual dispatch as a dry run.
#
# On a TAG: builds the wheel and the source distribution, proves the wheel
# installs into an empty environment and imports, checks the tag matches the
# packaged version, and attaches both files to a GitHub Release.
#
# On a MANUAL dispatch: builds and proves the install, then stops. The tag
# check and the Release attachment are both skipped, because on a manual run
# the ref is a branch and there is no tag to compare against or release to.
# That is the dry run: it answers "would this build and install" without
# creating anything. Every step below that only makes sense for a real tag
# carries `if: github.ref_type == 'tag'` so it cannot fire on a branch.
#
# What it deliberately does NOT do: publish to PyPI. That job is written below
# and stays skipped until the repository variable PUBLISH_TO_PYPI is set to
# the string "true", so tagging can never publish by accident before the Board
# decides to. There is no API token to add: the publish step uses PyPI trusted
# publishing over OIDC, which is why the job asks for `id-token: write` and
# stores no secret at all. Setting that one variable is the whole switch.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -l dist/

      # Same discriminator as the tests workflow. A release that cannot be
      # installed is worse than no release, and the only way to know is to
      # install it somewhere that has nothing else in it.
      - name: Prove the wheel installs and imports from an empty environment
        run: |
          python -m venv /tmp/rel
          /tmp/rel/bin/python -m pip install --upgrade pip
          /tmp/rel/bin/python -m pip install dist/*.whl
          /tmp/rel/bin/python -c "import firm, firm.mcp.tools; print('import ok')"
          /tmp/rel/bin/cadre --version
          /tmp/rel/bin/firm --version

      # Tags only. On a manual dispatch the ref is a branch, so there is no
      # tag to compare and this step would always fail — an advertised trigger
      # that can never pass. Gating on ref_type also removes the need for an
      # emptiness guard on TAG: a ref named exactly "v" used to strip to the
      # empty string and skip the comparison in silence, which is a check
      # passing by finding nothing. It now compares every time it runs.
      - name: Check that the tag matches the packaged version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(/tmp/rel/bin/python -c "import importlib.metadata as m; print(m.version('cadre'))")
          echo "tag=$TAG packaged=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "The tag and the packaged version disagree. Fix pyproject.toml or the tag." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

      # Tags only, for the same reason. A manual dry run must not create a
      # GitHub Release named after a branch.
      - name: Attach the distribution to the GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Two conditions, and both are load-bearing.
    #
    # The repository VARIABLE PUBLISH_TO_PYPI must be the string "true". That
    # variable is the switch, not a secret: the step below publishes over OIDC
    # trusted publishing and holds no token.
    #
    # The ref must also be a tag. Before the manual dry run was made to pass,
    # this job was locked shut by accident: a manual dispatch always failed the
    # tag check, so `build` failed, so `publish` could never reach its own
    # condition. Fixing the dry run removed that accidental lock, which would
    # have left a manual dispatch from ANY branch able to build that branch and
    # publish it the day the variable was set. Publishing to PyPI cannot be
    # undone, so the gate is explicit rather than inherited from a failure.
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' && github.ref_type == 'tag' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
